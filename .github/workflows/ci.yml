name: Docker CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 코드
        uses: actions/checkout@v3

      - name: Docker Build
        run: |
          docker build -t test-build-image .

      - name: Dockerfile Lint (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
